<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Banking Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#131b2e',
                        cardBorder: '#1e293b',
                        accentBlue: '#3b82f6',
                        modalBg: 'rgba(19, 27, 46, 0.85)',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom smooth backdrop blur for modern iOS feel */
        .glass-modal {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white pb-6">

    <!-- Top Mobile Header / Nav Bar -->
    <header class="w-full bg-[#0d1322] border-b border-[#1a263d] px-4 py-3 flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <!-- App Icon / Logo Box -->
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-white shadow-lg shadow-blue-900/30">
                <i class="fa-solid fa-building-columns text-sm"></i>
            </div>
            <!-- Domain text matching style -->
            <span class="text-xs font-medium text-slate-300 tracking-wide bg-[#131b2e] px-2.5 py-1 rounded-md border border-[#23314d]">
                com418.github.io
            </span>
        </div>

        <div class="flex items-center space-x-3">
            <button class="w-9 h-9 rounded-full bg-[#131b2e] border border-[#23314d] flex items-center justify-center text-slate-300 hover:text-white transition">
                <i class="fa-regular fa-bell text-sm"></i>
            </button>
            <div class="w-9 h-9 rounded-full overflow-hidden border border-blue-500/40 bg-slate-800 flex items-center justify-center">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <!-- Main Dashboard Content -->
    <main class="flex-1 px-4 py-5 max-w-md mx-auto w-full space-y-4">
        
        <!-- Account Holder Card -->
        <div class="bg-[#111827] border border-[#1f293d] rounded-2xl p-4 shadow-sm relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-blue-500/5 rounded-full blur-xl pointer-events-none"></div>
            <div class="flex items-center space-x-3 text-slate-400 text-xs font-medium uppercase tracking-wider mb-1">
                <i class="fa-regular fa-user text-blue-400"></i>
                <span>Account Holder</span>
            </div>
            <div class="text-lg font-bold text-white tracking-wide">
                Maro Ejiata
            </div>
        </div>

        <!-- IP Address Card -->
        <div class="bg-[#111827] border border-[#1f293d] rounded-2xl p-4 shadow-sm flex items-center justify-between">
            <div>
                <div class="flex items-center space-x-3 text-slate-400 text-xs font-medium uppercase tracking-wider mb-1">
                    <i class="fa-solid fa-globe text-blue-400"></i>
                    <span>IP Address</span>
                </div>
                <div class="text-base font-semibold text-slate-200 tracking-wider">
                    10.30.162.149
                </div>
            </div>
            <div class="w-8 h-8 rounded-lg bg-blue-500/10 flex items-center justify-center text-blue-400">
                <i class="fa-solid fa-shield-halved text-xs"></i>
            </div>
        </div>

        <!-- Action / Feature Trigger Card -->
        <div class="bg-[#111827] border border-[#1f293d] rounded-2xl p-5 shadow-sm text-center relative">
            <h3 class="text-sm font-medium text-slate-300 mb-3">Priority Concierge Services</h3>
            <button id="triggerModalBtn" class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/25 transition active:scale-[0.98] flex items-center justify-center space-x-2">
                <i class="fa-solid fa-headset text-sm"></i>
                <span>Connect 24/7 Concierge</span>
            </button>
        </div>

        <!-- Daily Transaction & Wire Limits Card -->
        <div class="bg-[#111827] border border-[#1f293d] rounded-2xl p-5 shadow-sm space-y-4">
            <div class="flex items-start justify-between">
                <div>
                    <h2 class="text-base font-bold text-white mb-1">Daily Transaction & Wire Limits</h2>
                    <p class="text-xs text-slate-400">Resets every 24 hours at 00:00 UTC</p>
                </div>
                <span class="px-2.5 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 text-[10px] font-bold tracking-wider rounded-md uppercase">
                    Tier 1 Limit
                </span>
            </div>

            <div class="pt-2 border-t border-[#1f293d]/50">
                <div class="text-xs uppercase tracking-wider text-slate-400 font-medium mb-1">Daily Limit Max</div>
                <div class="text-2xl font-black text-white tracking-tight flex items-center space-x-1">
                    <span>€5,000,000</span>
                    <span class="text-xs font-normal text-slate-500">.00</span>
                </div>
            </div>
        </div>

    </main>

    <!-- Simulated iOS Browser Bottom Toolbar -->
    <footer class="w-full bg-[#0d1322] border-t border-[#1a263d] px-6 py-3 flex items-center justify-between max-w-md mx-auto sticky bottom-0 z-30">
        <button class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-arrow-left text-base"></i></button>
        <button class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-arrow-right text-base"></i></button>
        <button class="w-9 h-9 rounded-full bg-[#1a263d] flex items-center justify-center text-slate-200 hover:text-white transition shadow"><i class="fa-solid fa-plus text-sm"></i></button>
        <button class="px-2 py-0.5 rounded border border-slate-700 text-xs font-bold text-slate-300">53</button>
        <button class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-ellipsis text-base"></i></button>
    </footer>


    <!-- ========================================== -->
    <!-- REAL SVG DIALOG POPUP OVERLAY (USER REQUEST) -->
    <!-- ========================================== -->
    <div id="svgModalOverlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal transition-opacity duration-300">
        
        <!-- SVG Container for Dialog Box mimicking exact iOS alert style with crisp vector paths & styling -->
        <div class="w-full max-w-[310px] transform transition-all duration-300 scale-100 animate-in fade-in zoom-in-95">
            <svg viewBox="0 0 310 215" class="w-full h-auto drop-shadow-2xl" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Modal card background gradient -->
                    <linearGradient id="modalBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#192338" />
                        <stop offset="100%" stop-color="#121a2c" />
                    </linearGradient>
                    
                    <!-- Button OK gradient -->
                    <linearGradient id="btnOkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#22304c" />
                        <stop offset="100%" stop-color="#182236" />
                    </linearGradient>

                    <!-- Button Suppress gradient -->
                    <linearGradient id="btnSuppressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#1d2638" />
                        <stop offset="100%" stop-color="#131a28" />
                    </linearGradient>

                    <!-- Subtle inner glow shadow filter -->
                    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
                    </filter>
                </defs>

                <!-- Modal Window Background Rect with Rounded Corners -->
                <rect x="2" y="2" width="306" height="211" rx="24" fill="url(#modalBgGrad)" stroke="#2b3b5c" stroke-width="1.2" filter="url(#boxShadow)" />

                <!-- Header Title: com418.github.io says -->
                <text x="155" y="32" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="0.2">com418.github.io says</text>

                <!-- Body Message Line 1 -->
                <text x="155" y="60" text-anchor="middle" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Connecting to secure 24/7 Priority</text>
                
                <!-- Body Message Line 2 -->
                <text x="155" y="78" text-anchor="middle" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Concierge line...</text>

                <!-- Divider line between text and buttons -->
                <line x1="16" y1="96" x2="294" y2="96" stroke="#222f48" stroke-width="1" />

                <!-- Button 1: OK -->
                <g id="okButton" class="cursor-pointer transition hover:opacity-90" onclick="closeModal()">
                    <rect x="24" y="106" width="262" height="42" rx="14" fill="url(#btnOkGrad)" stroke="#2d3f63" stroke-width="1" />
                    <text x="155" y="131" text-anchor="middle" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="15" font-weight="600" letter-spacing="0.3">OK</text>
                </g>

                <!-- Button 2: Suppress dialogues -->
                <g id="suppressButton" class="cursor-pointer transition hover:opacity-90" onclick="closeModal()">
                    <rect x="24" y="156" width="262" height="42" rx="14" fill="url(#btnSuppressGrad)" stroke="#2d3f63" stroke-width="1" />
                    <text x="155" y="181" text-anchor="middle" fill="#f87171" font-family="'Inter', sans-serif" font-size="14" font-weight="500" letter-spacing="0.2">Suppress dialogues</text>
                </g>
            </svg>
        </div>
    </div>

    <!-- Interactive script to reopen or dismiss the SVG modal -->
    <script>
        const modalOverlay = document.getElementById('svgModalOverlay');
        const triggerBtn = document.getElementById('triggerModalBtn');

        function closeModal() {
            modalOverlay.style.opacity = '0';
            setTimeout(() => {
                modalOverlay.style.display = 'none';
            }, 300);
        }

        triggerBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'flex';
            setTimeout(() => {
                modalOverlay.style.opacity = '1';
            }, 10);
        });

        // Allow clicking outside the svg box to close it too
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });
    </script>
</body>
</html>
